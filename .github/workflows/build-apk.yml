name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/SKCT_AI_Solver.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKCT_AI_Solver_APK
          path: release-apk/SKCT_AI_Solver.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "SKCT AI Solver Android APK v1.0.0"
          body: |
            ## 📱 SKCT AI 실시간 고속 문제 풀이 안드로이드 공식 설치 파일 (APK)
            
            - **스마트폰 단독 실행**: PC 서버를 켤 필요 없이 폰에 설치하여 바로 사용 가능
            - **100% 전체화면 카메라**: 지문이나 표가 잘리지 않는 전체화면 프레임
            - **수동 원클릭 풀이**: 문제를 비추고 `[⚡ AI로 이 문제 풀기]` 버튼을 누를 때만 딱 1회 AI 호출 (API 무료 사용량 완벽 보호)
            - **설치 방법**: 아래 Assets에서 `SKCT_AI_Solver.apk`를 스마트폰으로 다운로드하여 설치하세요.
          files: release-apk/SKCT_AI_Solver.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
