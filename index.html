<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKCT AI 초고속 풀이</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ff88">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SKCT AI">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Camera Viewport -->
    <div id="camera-container">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="hidden-canvas" style="display: none;"></canvas>

      <!-- Viewfinder Overlay -->
      <div id="viewfinder" class="aspect-standard">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="scan-laser"></div>
        <div class="guide-text">문제를 박스 안에 맞추고 1초간 멈추세요</div>
      </div>

      <!-- Stability Progress Bar -->
      <div id="stability-bar-container">
        <div id="stability-bar"></div>
      </div>

      <!-- Status Indicator -->
      <div id="status-pill">카메라 시작 중...</div>

      <!-- Top Control Bar -->
      <div id="top-bar">
        <div class="logo">⚡ SKCT AI</div>
        <div class="top-actions">
          <button id="install-app-btn" class="icon-btn install hidden" title="홈 화면에 앱 설치">📲 앱 설치</button>
          <button id="aspect-btn" class="icon-btn" title="박스 비율 변경">📐 <span id="aspect-label">표준</span></button>
          <button id="settings-btn" class="icon-btn" title="설정">⚙️</button>
        </div>
      </div>

      <!-- Manual capture button -->
      <button id="manual-snap-btn" title="터치로 즉시 캡처">📸</button>
    </div>

    <!-- Huge Answer Overlay -->
    <div id="result-overlay" class="hidden">
      <div class="result-card">
        <div class="result-label">정답</div>
        <div id="result-answer" class="huge-answer">4번</div>
        <div id="result-reason" class="result-reason">[수열추리] 계차 +3, +6, +12 등비 규칙</div>
        
        <div class="result-actions">
          <button id="view-detail-btn" class="action-btn">📖 상세 풀이 보기</button>
        </div>

        <div class="touch-hint">👉 화면 아무 곳이나 터치하면 다음 문제</div>
      </div>
    </div>

    <!-- Step-by-Step Detail Modal -->
    <div id="detail-modal" class="hidden modal-container">
      <div class="modal-content detail-content">
        <div class="modal-header">
          <h3>📖 단계별 상세 풀이</h3>
          <button id="close-detail-btn" class="close-btn">✕</button>
        </div>
        <div class="detail-body">
          <div class="detail-ans-summary">
            <span id="modal-ans-badge" class="badge">4번 (④)</span>
            <span id="modal-model-badge" class="model-badge">gemini-2.0-flash</span>
          </div>
          <div class="detail-box">
            <h4>핵심 근거</h4>
            <p id="modal-reason-text">-</p>
          </div>
          <div class="detail-box">
            <h4>단계별 해설 과정</h4>
            <div id="modal-detail-text" class="detail-steps">-</div>
          </div>
        </div>
        <div class="modal-actions">
          <button id="close-detail-action-btn" class="btn primary">닫기 및 다음 문제 풀이</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden modal-container">
      <div class="modal-content">
        <div class="modal-header">
          <h3>⚙️ 풀이 엔진 설정</h3>
          <button id="close-settings-btn" class="close-btn">✕</button>
        </div>
        <div class="form-group">
          <label for="api-key-input">Google Gemini API Key (무료)</label>
          <input type="password" id="api-key-input" placeholder="Google AI Studio에서 발급받은 무료 키 입력">
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-btn">
            🔗 10초 만에 무료 API 키 받기 (Google AI Studio)
          </a>
        </div>
        <div class="form-group">
          <label for="model-select">AI 추론 엔진</label>
          <select id="model-select" class="form-select">
            <option value="gemini-2.0-flash" selected>gemini-2.0-flash (초고속 실전 모드 - 추천)</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash (추론 고도화 모드)</option>
            <option value="gemini-1.5-pro">gemini-1.5-pro (심층 분석 모드)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sensitivity-slider">흔들림 멈춤 감도 (정지 인식)</label>
          <input type="range" id="sensitivity-slider" min="5" max="30" value="15">
          <span id="sensitivity-val">보통 (15)</span>
        </div>
        <div class="modal-actions">
          <button id="save-settings-btn" class="btn primary">저장 및 시작</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
