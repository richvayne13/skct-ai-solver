<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SKCT AI 초고속 풀이</title>
  
  <meta name="theme-color" content="#00ff88">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SKCT AI">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Force Cache Clear -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) caches.delete(names[i]);
      });
    }
    window.onerror = function(msg, url, line) {
      var eb = document.getElementById('error-banner');
      if (eb) {
        eb.style.display = 'block';
        eb.textContent = '⚠️ ' + msg;
      }
      return false;
    };
  </script>

  <link rel="stylesheet" href="style.css?v=20260925_2">
</head>
<body>
  <div id="app">
    <!-- On-screen Error Banner -->
    <div id="error-banner" style="display:none; position:fixed; top:0; left:0; right:0; background:#ff0033; color:#fff; font-size:12px; font-weight:bold; padding:8px 12px; z-index:9999; word-break:break-all;"></div>

    <!-- Camera Viewport (100% Fullscreen) -->
    <div id="camera-container">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="hidden-canvas" style="display: none;"></canvas>

      <!-- Clean Corner Target Marks -->
      <div id="fullscreen-frame">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
      </div>

      <!-- Status Indicator -->
      <div id="status-pill">문제를 화면에 비추고 아래 버튼을 누르세요</div>

      <!-- Camera Start Touch Overlay -->
      <div id="start-cam-prompt" class="start-cam-prompt hidden">
        <button id="start-cam-btn" class="start-cam-btn">📷 카메라 켜기 (터치)</button>
      </div>

      <!-- Top Control Bar -->
      <div id="top-bar">
        <div class="logo">⚡ SKCT AI</div>
        <div class="top-actions">
          <button id="install-app-btn" class="icon-btn install hidden" title="홈 화면에 앱 설치">📲 앱 설치</button>
          <button id="settings-btn" class="icon-btn" title="설정" onclick="window.openSettingsModal && window.openSettingsModal(event)">⚙️ 설정</button>
        </div>
      </div>

      <!-- Big Button: Only Solves When Clicked (API 낭비 0%) -->
      <button id="snap-solve-btn" class="snap-solve-btn">
        <span class="btn-icon">⚡</span> AI로 이 문제 풀기
      </button>
    </div>

    <!-- Huge Answer Overlay -->
    <div id="result-overlay" class="hidden">
      <div class="result-card">
        <div class="result-label">정답</div>
        <div id="result-answer" class="huge-answer">4번</div>
        <div id="result-reason" class="result-reason">[수열추리] 계차 +3, +6, +12 등비 규칙</div>
        
        <div class="result-actions">
          <button id="view-detail-btn" class="action-btn">📖 상세 풀이 보기</button>
        </div>

        <div class="touch-hint">👉 화면 아무 곳이나 터치하면 다음 문제 리셋</div>
      </div>
    </div>

    <!-- Step-by-Step Detail Modal -->
    <div id="detail-modal" class="hidden modal-container">
      <div class="modal-content detail-content">
        <div class="modal-header">
          <h3>📖 단계별 상세 풀이</h3>
          <button id="close-detail-btn" class="close-btn">✕</button>
        </div>
        <div class="detail-body">
          <div class="detail-ans-summary">
            <span id="modal-ans-badge" class="badge">4번 (④)</span>
            <span id="modal-model-badge" class="model-badge">gemini-2.0-flash</span>
          </div>
          <div class="detail-box">
            <h4>핵심 근거</h4>
            <p id="modal-reason-text">-</p>
          </div>
          <div class="detail-box">
            <h4>단계별 해설 과정</h4>
            <div id="modal-detail-text" class="detail-steps">-</div>
          </div>
        </div>
        <div class="modal-actions">
          <button id="close-detail-action-btn" class="btn primary">닫기 및 다음 문제 풀기</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden modal-container">
      <div class="modal-content">
        <div class="modal-header">
          <h3>⚙️ 풀이 엔진 설정</h3>
          <button id="close-settings-btn" class="close-btn" onclick="window.closeSettingsModal && window.closeSettingsModal(event)">✕</button>
        </div>
        <div class="form-group">
          <label for="api-key-input">Google Gemini API Key (무료)</label>
          <input type="password" id="api-key-input" placeholder="Google AI Studio에서 발급받은 무료 키 입력">
          <div class="quota-tip">
            💡 <strong>무료 쿼터 초과 시</strong>: 아래 링크에서 새 무료 키를 10초 만에 만들어 넣으시면 즉시 한도가 리셋됩니다!
          </div>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-btn">
            🔗 무료 새 API 키 만들기 (Google AI Studio)
          </a>
        </div>
        <div class="form-group">
          <label for="model-select">AI 추론 엔진</label>
          <select id="model-select" class="form-select">
            <option value="gemini-2.0-flash" selected>gemini-2.0-flash (초고속 실전 모드 - 기본)</option>
            <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite (초경량/쿼터 절약 모드)</option>
            <option value="gemini-1.5-flash">gemini-1.5-flash (안정적 보조 모드)</option>
          </select>
        </div>
        <div class="modal-actions">
          <button id="save-settings-btn" class="btn primary">저장 및 시작</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js?v=20260925_2"></script>
</body>
</html>
